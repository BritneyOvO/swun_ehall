name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze lib test
      - run: flutter test

  apk:
    name: Compile APK
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g
      AMAP_KEY: ${{ secrets.AMAP_KEY }}
      BUGLY_APP_ID: ${{ secrets.BUGLY_APP_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "No upload keystore secret; APKs will use the default debug key."
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          python3 -c 'import os; open("android/key.properties","w").write("storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n" % (os.environ["ANDROID_KEYSTORE_PASSWORD"], os.environ["ANDROID_KEY_PASSWORD"], os.environ["ANDROID_KEY_ALIAS"]))'
      - name: Build debug APK
        run: flutter build apk --debug --target-platform android-arm64
      - name: Build release APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: flutter build apk --release --target-platform android-arm64
      - name: Name artifacts
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-debug.apk dist/swun_ehall-debug-arm64.apk
          if [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-release.apk dist/swun_ehall-release-arm64.apk
          fi
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            ver="${GITHUB_REF_NAME#v}"
            mv dist/swun_ehall-debug-arm64.apk "dist/swun_ehall-${ver}-arm64-debug.apk"
            if [ -f dist/swun_ehall-release-arm64.apk ]; then
              mv dist/swun_ehall-release-arm64.apk "dist/swun_ehall-${ver}-arm64-release.apk"
            fi
          fi
          ls -lh dist
      - name: Release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          ver = os.environ["GITHUB_REF_NAME"].lstrip("v")
          lines = Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()
          start = next((i for i, l in enumerate(lines) if l.strip() == f"## {ver}"), None)
          notes = ""
          if start is not None:
              chunk = []
              for line in lines[start + 1 :]:
                  if line.startswith("## "):
                      break
                  chunk.append(line)
              notes = "\n".join(chunk).strip()
          parts = [
              f"# 民大助手 / MinDa ZhuShou v{ver}",
              "",
              "Android arm64-v8a",
              "",
          ]
          if notes:
              parts.extend([notes, ""])
          parts.extend(
              [
                  "## 下载 | Downloads",
                  "",
                  f"- `swun_ehall-{ver}-arm64-release.apk` — 正式包 / Release",
                  f"- `swun_ehall-{ver}-arm64-debug.apk` — 调试包 / Debug",
                  "",
                  "仅学生账号 · Student accounts only",
                  "非官方应用 · Unofficial app",
              ]
          )
          Path("dist").mkdir(exist_ok=True)
          Path("dist/RELEASE_NOTES.md").write_text("\n".join(parts) + "\n", encoding="utf-8")
          print(Path("dist/RELEASE_NOTES.md").read_text(encoding="utf-8"))
          PY
      - uses: actions/upload-artifact@v5
        with:
          name: apk
          path: dist/*.apk
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*.apk
          body_path: dist/RELEASE_NOTES.md

name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --stacktrace

  apk:
    name: Compile APK
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g
      AMAP_KEY: ${{ secrets.AMAP_KEY }}
      BUGLY_APP_ID: ${{ secrets.BUGLY_APP_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "No upload keystore secret; APKs will use the default debug key."
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          python3 -c 'import os; open("android/key.properties","w").write("storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n" % (os.environ["ANDROID_KEYSTORE_PASSWORD"], os.environ["ANDROID_KEY_PASSWORD"], os.environ["ANDROID_KEY_ALIAS"]))'
      - name: Build debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug
      - name: Build release APK
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: android
        run: ./gradlew :app:assembleRelease
      - name: Name artifacts
        run: |
          python3 - <<'PY'
          import json
          import os
          import shutil
          from pathlib import Path
          dist = Path("dist")
          dist.mkdir(exist_ok=True)
          tagged = os.environ["GITHUB_REF"].startswith("refs/tags/v")
          for mode in (("debug", "release") if tagged else ("debug",)):
              folder = Path("android/app/build/outputs/apk") / mode
              meta = json.loads((folder / "output-metadata.json").read_text())
              element, = meta["elements"]
              suffix = f"{element['versionName']}-{element['versionCode']}-" if tagged else ""
              if tagged and element["versionName"] != os.environ["GITHUB_REF_NAME"][1:]:
                  raise SystemExit("APK version does not match release tag")
              shutil.copyfile(folder / element["outputFile"], dist / f"swun_ehall-{suffix}arm64-{mode}.apk")
          PY
          ls -lh dist
      - name: Release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          ver = os.environ["GITHUB_REF_NAME"].lstrip("v")
          meta = json.loads(Path("android/app/build/outputs/apk/release/output-metadata.json").read_text())
          code = meta["elements"][0]["versionCode"]
          lines = Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()
          start = next((i for i, l in enumerate(lines) if l.strip() == f"## {ver}"), None)
          notes = ""
          if start is not None:
              chunk = []
              for line in lines[start + 1 :]:
                  if line.startswith("## "):
                      break
                  chunk.append(line)
              notes = "\n".join(chunk).strip()
          parts = [
              f"# 民大助手 / MinDa ZhuShou v{ver}",
              "",
              "Android arm64-v8a · Jetpack Compose + MIUIX",
              "",
          ]
          if notes:
              parts.extend([notes, ""])
          parts.extend(
              [
                  "## 下载 | Downloads",
                  "",
                  f"- `swun_ehall-{ver}-{code}-arm64-release.apk` — 正式包 / Release",
                  f"- `swun_ehall-{ver}-{code}-arm64-debug.apk` — 调试包 / Debug",
                  "",
                  "仅学生账号 · Student accounts only",
                  "非官方应用 · Unofficial app",
              ]
          )
          Path("dist").mkdir(exist_ok=True)
          Path("dist/RELEASE_NOTES.md").write_text("\n".join(parts) + "\n", encoding="utf-8")
          PY
      - uses: actions/upload-artifact@v5
        with:
          name: apk
          path: dist/*.apk
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*.apk
          body_path: dist/RELEASE_NOTES.md

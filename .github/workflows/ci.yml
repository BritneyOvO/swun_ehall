name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze lib test
      - run: flutter test

  apk:
    name: Compile APK
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "No upload keystore secret; release APK will use debug signing."
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          python3 -c 'import os; open("android/key.properties","w").write("storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n" % (os.environ["ANDROID_KEYSTORE_PASSWORD"], os.environ["ANDROID_KEY_PASSWORD"], os.environ["ANDROID_KEY_ALIAS"]))'
      - name: Build debug APK
        run: flutter build apk --debug --target-platform android-arm64
      - name: Build release APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: flutter build apk --release --target-platform android-arm64
      - name: Name artifacts
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-debug.apk dist/swun_ehall-debug-arm64.apk
          if [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-release.apk dist/swun_ehall-release-arm64.apk
          fi
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            ver="${GITHUB_REF_NAME#v}"
            mv dist/swun_ehall-debug-arm64.apk "dist/swun_ehall-${ver}-arm64-debug.apk"
            if [ -f dist/swun_ehall-release-arm64.apk ]; then
              mv dist/swun_ehall-release-arm64.apk "dist/swun_ehall-${ver}-arm64-release.apk"
            fi
          fi
          ls -lh dist
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/*.apk
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*.apk
          body: |
            民大助手 ${{ github.ref_name }}（Android arm64-v8a）

            - `*-arm64-debug.apk`：调试包，方便对照日志
            - `*-arm64-release.apk`：发布包

            只服务学生账号。非官方应用。
